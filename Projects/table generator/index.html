<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../table generator/assets/styles.css">
    <title>Multiplication Table Generator</title>
</head>

<body>

        </button>

        <div id="output"></div>

    </div>

    <script src="../table generator/assets/script.js"></script>
</body>

</html>
